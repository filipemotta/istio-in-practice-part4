# An L7 route for fraud-check in the ambient namespace. The parent is the
# Service itself (the GAMMA pattern), so the waypoint that serves fraud-check
# programs it: requests get the header x-served-by: waypoint-route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fraud-check
  namespace: payments-ambient
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: fraud-check
    port: 8080
  rules:
  - filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: x-served-by
          value: waypoint-route
    backendRefs:
    - name: fraud-check
      port: 8080

# Ambient-mode namespace: no sidecar. The ztunnel of each node carries the
# traffic (mTLS over HBONE) and is not Envoy; the waypoint (ambient/waypoint.yaml)
# is an Envoy deployment that handles L7 for the Services of the namespace,
# which opts in with istio.io/use-waypoint.
apiVersion: v1
kind: Namespace
metadata:
  name: payments-ambient
  labels:
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: waypoint
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: payments-ambient
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-check
  namespace: payments-ambient
---
# The caller: curl standing in for the service code.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments-ambient
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      serviceAccountName: payments-api
      containers:
      - name: app
        image: curlimages/curl:8.23.0
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-check
  namespace: payments-ambient
spec:
  selector:
    app: fraud-check
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-check
  namespace: payments-ambient
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-check
  template:
    metadata:
      labels:
        app: fraud-check
    spec:
      serviceAccountName: fraud-check
      containers:
      - name: fortio
        image: fortio/fortio:1.76.0
        args: ["server", "-loglevel", "Verbose"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /debug
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi

# vs-host-lint fixture: the registry as `kubectl get service,serviceentry -A
# -o yaml` prints it (kind: List), trimmed to the fields the lint reads.
apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Service
  metadata:
    name: fraud-check
    namespace: payments
  spec:
    ports:
    - name: http
      port: 8080
- apiVersion: networking.istio.io/v1
  kind: ServiceEntry
  metadata:
    name: github
    namespace: payments
  spec:
    hosts:
    - api.github.com
    ports:
    - name: tls
      number: 443
      protocol: TLS
    resolution: DNS

# Silent error: portNumber 15006, the port of the inbound listener, instead of
# the service port. Accepted by the API server; matches nothing. For the
# virtual listeners (15001, 15006) istiod compares portNumber with the
# destination port of each filter chain, and no chain has destination port 15006.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: fraud-check-ratelimit-15006
  namespace: payments
spec:
  workloadSelector:
    labels:
      app: fraud-check
  priority: 10
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        portNumber: 15006
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter:
              name: envoy.filters.http.router
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          stat_prefix: http_local_rate_limiter
          token_bucket:
            max_tokens: 5
            tokens_per_fill: 5
            fill_interval: 60s
          filter_enabled:
            runtime_key: local_rate_limit_enabled
            default_value:
              numerator: 100
              denominator: HUNDRED
          filter_enforced:
            runtime_key: local_rate_limit_enforced
            default_value:
              numerator: 100
              denominator: HUNDRED

# Silent error: the deprecated filter name envoy.http_connection_manager,
# copied from an old example. Accepted by the API server with only a warning
# ("using deprecated filter name"); istiod generates the canonical name
# envoy.filters.network.http_connection_manager and compares names exactly, so
# the patch matches nothing.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: fraud-check-ratelimit-old-name
  namespace: payments
spec:
  workloadSelector:
    labels:
      app: fraud-check
  priority: 10
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        portNumber: 8080
        filterChain:
          filter:
            name: envoy.http_connection_manager
            subFilter:
              name: envoy.filters.http.router
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          stat_prefix: http_local_rate_limiter
          token_bucket:
            max_tokens: 5
            tokens_per_fill: 5
            fill_interval: 60s
          filter_enabled:
            runtime_key: local_rate_limit_enabled
            default_value:
              numerator: 100
              denominator: HUNDRED
          filter_enforced:
            runtime_key: local_rate_limit_enforced
            default_value:
              numerator: 100
              denominator: HUNDRED
